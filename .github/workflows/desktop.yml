# Construit l'application desktop (NativePHP) pour macOS, Windows et Linux.
# Lancement manuel (onglet Actions) ou à chaque tag v* (ex. v1.0.0).
#
# Signature macOS (facultative : sans ces secrets, l'app est construite non signée) :
#   CSC_LINK              certificat « Developer ID Application » exporté en .p12, encodé en base64
#   CSC_KEY_PASSWORD      mot de passe du .p12
#   APPLE_ID              identifiant Apple du compte développeur
#   APPLE_APP_PASSWORD    mot de passe d'application (appleid.apple.com → Mots de passe d'app)
#   APPLE_TEAM_ID         Team ID (developer.apple.com → Membership)
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Un nouveau lancement sur la même branche ou le même tag annule le précédent.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Doit rester aligné sur config.platform.php (composer.json).
  PHP_VERSION: '8.3'

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, os: mac, arch: arm64 }
          # static-php-cli 2.8.5 ne reconnaît que Visual Studio 2019 / 2022.
          - { runner: windows-2022, os: win, arch: x64 }
          - { runner: ubuntu-latest, os: linux, arch: x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: zip, gd, intl, fileinfo, sqlite3, pdo_sqlite
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le binaire PHP embarqué (avec xmlreader / xmlwriter) ne dépend que de ces
      # scripts : il n'est recompilé que s'ils changent.
      - name: Cache du binaire PHP
        id: php-bin
        uses: actions/cache@v4
        with:
          path: nativephp/php-bin
          key: php-bin-${{ matrix.os }}-${{ matrix.arch }}-${{ env.PHP_VERSION }}-${{ hashFiles('scripts/build-php.*') }}

      - name: Compilation du binaire PHP (macOS / Linux)
        if: steps.php-bin.outputs.cache-hit != 'true' && matrix.os != 'win'
        shell: bash
        run: |
          set -o pipefail
          scripts/build-php.sh "$PHP_VERSION" 2>&1 | tee "$RUNNER_TEMP/build-php.log"
        env:
          SPC_WORKDIR: ${{ runner.temp }}/spc
          # static-php-cli interroge l'API GitHub : sans jeton, il est vite limité (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilation du binaire PHP (Windows)
        if: steps.php-bin.outputs.cache-hit != 'true' && matrix.os == 'win'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build-php.ps1 -PhpVersion $env:PHP_VERSION *>&1 | Tee-Object "$env:RUNNER_TEMP/build-php.log"
          exit $LASTEXITCODE
        env:
          SPC_WORKDIR: C:\spc
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      # Assets Vite : nécessaires aux tests qui affichent des pages (et à l'application).
      - run: npm run build

      - name: Préparation du .env et de la version
        shell: bash
        run: |
          cp .env.example .env
          # En debug, NativePHP garde la base et le stockage dans le paquet au lieu du
          # dossier de données de l'utilisateur : l'application livrée doit être en production.
          php -r '$e = file_get_contents(".env"); $e = preg_replace(["/^APP_ENV=.*/m", "/^APP_DEBUG=.*/m"], ["APP_ENV=production", "APP_DEBUG=false"], $e); file_put_contents(".env", $e);'
          grep -qx 'APP_DEBUG=false' .env
          php artisan key:generate --force
          # Tag v1.2.3 → version 1.2.3 ; lancement manuel → 0.0.0-dev.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "NATIVEPHP_APP_VERSION=$v" >> "$GITHUB_ENV"

      # Les tests tournent avec le PHP qui sera livré : imports .xlsx (xmlreader) et, sous
      # Windows, absence d'intl sont ainsi vérifiés sur le vrai binaire.
      - name: Tests avec le PHP embarqué
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/php-embedded"
          unzip -o -q nativephp/php-bin/bin/${{ matrix.os }}/${{ matrix.arch }}/php-$PHP_VERSION.zip -d "$RUNNER_TEMP/php-embedded"
          php_bin="$RUNNER_TEMP/php-embedded/php"; [ -f "$php_bin.exe" ] && php_bin="$php_bin.exe"
          "$php_bin" -v
          set -o pipefail
          "$php_bin" -d memory_limit=512M vendor/bin/pest --colors=never 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Signature macOS
        if: matrix.os == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::Secrets de signature absents : application macOS non signée."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Trousseau de signature préparé ici plutôt que par electron-builder : sa version
          # 26.8.1 passe le mot de passe du .p12 à « set-key-partition-list » au lieu de celui
          # du trousseau, ce qui échoue (SecKeychainUnlock) sur les runners macOS actuels.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::Aucun certificat « Developer ID Application » dans CSC_LINK."; exit 1; }
          echo "Identité de signature : $identity"

          # electron-builder signe avec ce trousseau ; CSC_LINK n'est volontairement pas transmis.
          {
            echo "MAC_SIGNED=true"
            echo "CSC_KEYCHAIN=$keychain"
            echo "CSC_NAME=${identity#Developer ID Application: }"
          } >> "$GITHUB_ENV"

      # native:build ne renvoie pas toujours d'erreur quand electron-builder échoue :
      # on vérifie que des installeurs ont bien été produits.
      - name: Construction de l'application
        shell: bash
        run: |
          set -o pipefail
          php artisan native:build ${{ matrix.os }} ${{ matrix.arch }} --no-interaction 2>&1 | tee "$RUNNER_TEMP/native-build.log"
          find nativephp/electron/dist -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | grep -q . \
            || { echo "Aucun installeur produit dans nativephp/electron/dist"; exit 1; }
        env:
          NATIVEPHP_PHP_BINARY_PATH: nativephp/php-bin/
          NATIVEPHP_APPLE_ID: ${{ secrets.APPLE_ID }}
          NATIVEPHP_APPLE_ID_PASS: ${{ secrets.APPLE_APP_PASSWORD }}
          NATIVEPHP_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Le script de notarisation de NativePHP ignore ses erreurs : on vérifie nous-mêmes
      # que Gatekeeper accepte l'application signée et notarisée.
      - name: Vérification de la notarisation
        if: matrix.os == 'mac' && env.MAC_SIGNED == 'true'
        shell: bash
        run: |
          app=$(find nativephp/electron/dist -maxdepth 2 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      # Les logs d'Actions ne sont lisibles qu'authentifié : en cas d'échec, la fin du log
      # de compilation est publiée en annotation, visible sur la page du run.
      - name: Suppression du trousseau de signature
        if: always() && env.CSC_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$CSC_KEYCHAIN" || true

      - name: Résumé de l'échec
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/build-php.log" "$SPC_WORKDIR"/log/spc.output.log "$SPC_WORKDIR"/log/spc.shell.log "$RUNNER_TEMP/tests.log" "$RUNNER_TEMP/native-build.log"; do
            [ -f "$f" ] || continue
            msg=$(tail -n 40 "$f" | perl -pe 's/\e\[[0-9;]*m//g; s/\r//g; s/%/%25/g; s/\n/%0A/g')
            echo "::error title=$(basename "$f")::$msg"
          done
        env:
          SPC_WORKDIR: ${{ matrix.os == 'win' && 'C:\spc' || format('{0}/spc', runner.temp) }}

      - uses: actions/upload-artifact@v4
        with:
          name: MailPilot-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            nativephp/electron/dist/*.dmg
            nativephp/electron/dist/*.zip
            nativephp/electron/dist/*.exe
            nativephp/electron/dist/*.AppImage
            nativephp/electron/dist/*.deb
          if-no-files-found: error
          # Environ 650 Mo par lancement : les installeurs d'une release vont dans la release.
          retention-days: 7
